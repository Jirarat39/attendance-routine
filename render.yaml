services:
  - type: web
    name: attendance-routine
    env: docker
    plan: standard
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:5187
      - key: PORT
        value: "10000"
      - key: ConnectionStrings__AttendanceDb
        value: ""
    healthCheckPath: /api/health
